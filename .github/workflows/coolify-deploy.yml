name: coolify-deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 178.156.217.235
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -fsS -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              "http://127.0.0.1:8000/api/v1/deploy?uuid=os1hqxqflxpfedhd25jwkygo&force=true"
